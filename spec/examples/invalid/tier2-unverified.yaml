# Violates: Tier 2 requires a verified compensating action
# updatePreferences is Tier 2; no operation sets x-ctier-reverses to it.
openapi: 3.1.0
info:
  title: Tier 2 with no reverser
  version: 0.1.0
paths:
  /customers/{customerId}/preferences:
    patch:
      operationId: updatePreferences
      x-ctier-tier: 2
      x-ctier-status: declared
      x-ctier-criteria:
        reversibility: undo-restores-effect
        blast-radius: single-customer
        data-sensitivity: personal
        compliance-trigger: none
        idempotency: safe
      responses:
        '200': { description: updated }
